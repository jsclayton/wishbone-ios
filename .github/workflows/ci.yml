name: CI

# What runs where (docs/workflow.md, "CI"):
# - On a pull request and on a push to main, CI runs only fast checks: Changes
#   and Lint. The full gate runs on the contributor's Mac before the pull
#   request is ready, and its last line is in the PR.
# - The Gate jobs run the full gate only on a manual run (workflow_dispatch):
#   before each release, from `just cloud-build`, or by hand from the Actions
#   tab. They run the gate's steps in parts, side by side, and the Gate result
#   job adds them up. Its input `sha` names the commit to check, and
#   the run's name is "Gate on <sha>", so a run can be matched to a commit.
#
# Cost notes (macOS runners cost more than Linux runners, so CI avoids needless
# runs and keeps a hung job from running for hours):
# - Draft PRs don't run CI. Mark the PR ready for review to run it.
# - Title and body edits don't run CI. See pr-title.yml.
# - Docs-only changes skip every job but Changes. The Changes job runs the docs
#   check on every change, so docs-only changes get it.
# - On a PR, a new push cancels the older run.
# - Every job has timeout-minutes, so a hung step ends the job. The gate also
#   stops each of its own steps at a limit.
# - The ruleset requires "PR Title" and "CI OK", and the "gate" and "review"
#   commit statuses, which people set (docs/workflow.md). CI OK fails if a job it
#   needs failed or was cancelled. A skipped job counts as passed. On a manual
#   run, only the Gate jobs run, and CI OK needs the Gate result job to pass,
#   so CI OK is the gate's result.
# - Every job runs on a GitHub-hosted runner. Don't use a self-hosted runner:
#   it would run code from fork PRs.
# - CI builds unsigned and uses no secrets, so a fork's PR runs every pull
#   request job.

run-name: ${{ github.event_name == 'workflow_dispatch' && format('Gate on {0}', inputs.sha || github.sha) || '' }}

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: "The commit to check, as a full SHA. Empty: the head of the branch that you run on"
        required: false
        default: ""

# On a PR, a new push cancels the older run. On main, every push has a group of
# its own, so each commit gets its own run and none is cancelled. A manual run
# has a group for its commit, apart from the push of the same commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || inputs.sha || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # The Xcode version that the project pins. It moves by hand, with
  # docs/development.md.
  XCODE_VERSION: "27.2"

jobs:
  changes:
    name: Changes
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && !github.event.pull_request.draft)
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.detect.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Fail if private files are tracked
        run: |
          if git ls-files | grep -E '^(\.agent|\.claude|\.beads)/|\.local\.md$'; then
            echo "::error::Private files must not be committed."
            exit 1
          fi
      # The gate runs this check too, but a docs-only change skips the gate. The
      # check needs only Node, which the runner has.
      - name: Check the docs
        run: node scripts/check-docs.mjs
      - name: Detect changed areas
        id: detect
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            # On a PR, HEAD is the test merge commit and HEAD^1 is the base.
            base=HEAD^1
          else
            # On main, compare with the commit that main was at before the push.
            base=$BEFORE
            if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
              echo "Can't read the commit before the push ($base). Running everything."
              echo "code=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          # --no-renames lists both names of a renamed file. With only the new
          # name, a source file that moves into docs/ would read as docs only.
          files=$(git diff --name-only --no-renames "$base" HEAD)
          printf 'Changed files:\n%s\n' "$files"

          docs_only='^(docs/|LICENSE$|\.github/ISSUE_TEMPLATE/|\.github/pull_request_template\.md$)|\.md$'

          # An empty list is not docs only: when in doubt, run the gate.
          code=false
          if printf '%s\n' "$files" | grep -Evq "$docs_only"; then code=true; fi
          echo "code=$code"
          echo "code=$code" >> "$GITHUB_OUTPUT"

  # `just lint`: swift-format, actionlint, shellcheck, the docs check, and the
  # tests of the gate's scripts. swift-format comes with Xcode, and the gate's
  # tests expect macOS (they fail on Linux), so the job needs a macOS runner.
  # The package tests are not here: with warm caches they took 8m18s (run
  # 45463826364), so they stay in the full gate.
  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: xcode-27
    timeout-minutes: 10
    env:
      MISE_ENABLE_TOOLS: node,just,actionlint,shellcheck
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select Xcode
        run: |
          sudo xcode-select --switch "/Applications/Xcode_${XCODE_VERSION}.app"
          xcodebuild -version
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install_args: node just actionlint shellcheck
          minimum_release_age: 3d
      - name: Lint
        run: just lint

  # The full gate. It runs only on a manual run (workflow_dispatch), on the
  # commit in the input `sha`, or on the head of the branch that it runs on.
  # It runs in parts side by side (scripts/gate/parts.mjs), each part the
  # gate's own steps for some of its checks, with their limits and named flakes:
  # - Gate: build lints, builds the test server, and builds the app and its
  #   test bundles once, for the shards.
  # - Gate: journeys-1 to journeys-4 each run a shard of the journeys, on a
  #   runner and a simulator of their own, from the build job's build. One
  #   shard runs the hosted tests too, and one builds the package and its tests
  #   and runs them, while its simulator boots.
  # - Gate result adds the parts' counts up, checks that each journey ran once,
  #   holds the counts against the floor, and gives the gate's line.
  # GitHub runs at most 5 macOS jobs at once on this plan. A run has 5: the
  # build job alone, then the four shards at once, so a run never waits for its
  # own jobs. It waits only for macOS jobs of other runs, such as a PR's Lint.
  #
  # Each job's timeout-minutes is above the sum of the limits of its part's
  # steps (scripts/gate/steps.mjs), with room for the job's own steps before the
  # gate, so that a hung step is stopped by the gate, which says which step it
  # was. A gate test holds it.
  gate-build:
    name: "Gate: build"
    env:
      MISE_ENABLE_TOOLS: node,just,go,actionlint,shellcheck
    if: github.event_name == 'workflow_dispatch'
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha || github.sha }}
      - name: Select Xcode
        run: |
          sudo xcode-select --switch "/Applications/Xcode_${XCODE_VERSION}.app"
          xcodebuild -version
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install_args: node just go actionlint shellcheck
          minimum_release_age: 3d
      # Go builds the test server, so a change of Go builds it again.
      - name: Read Go's version
        id: go
        run: echo "version=$(go env GOVERSION)" >> "$GITHUB_OUTPUT"
      # The three caches that docs/development.md names. Each is keyed on a
      # file, and is skipped until that file exists:
      # - The pin file is the one file named `server-pin` that holds the commit
      #   of the test server. The server is built under build/server/. Its key
      #   also holds Go's version, and the scripts that hold the build's recipe:
      #   `just server` builds again when one of them changes, and a cache with
      #   the old key would never get the new build.
      # - Package.resolved appears with the first remote package.
      - name: Cache the built test server
        if: hashFiles('**/server-pin*') != ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/server
          key: server-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.version }}-${{ hashFiles('**/server-pin*', 'scripts/server/build.mjs', 'scripts/server/pin.mjs') }}
      - name: Cache Go's caches
        if: hashFiles('**/server-pin*') != ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/Library/Caches/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', '**/server-pin*') }}
          restore-keys: go-${{ runner.os }}-${{ runner.arch }}-
      - name: Cache SwiftPM's cache
        if: hashFiles('**/Package.resolved') != ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: swiftpm-${{ runner.os }}-${{ runner.arch }}-
      - name: Gate, the build part
        run: node scripts/gate/main.mjs --part=build
      # The build and the test server, for the journeys' jobs. A tar keeps the
      # files' modes and links, which an artifact's zip loses: the app's
      # binaries must stay executable.
      - name: Pack the build
        run: tar -cf build/gate-build.tar build/DerivedData/Build/Products build/server
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gate-build
          path: build/gate-build.tar
          compression-level: 1
          retention-days: 1
      # The part's record, for the Gate result job, which adds the parts up.
      - if: always() && hashFiles('build/gate/part-*.json') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gate-part-build
          path: build/gate/part-*.json
          retention-days: 7
      # The gate's logs and results, and the build's log. The gate keeps them
      # inside the checkout. They are uploaded when the part fails, and when
      # the part ran a run of the journeys again for a named flake and passed:
      # then the first try's result bundle and log, with `-first` at the end of
      # their names (keepFirstTry in scripts/gate/simulator.mjs), are kept too.
      - if: failure() || hashFiles('build/gate/**/*-first.log', 'build/gate/**/*-first.xcresult/**') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gate-results-build
          path: |
            build/gate/
            build/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7

  gate-journeys:
    name: "Gate: ${{ matrix.shard }}"
    needs: gate-build
    env:
      MISE_ENABLE_TOOLS: node,just
    if: github.event_name == 'workflow_dispatch'
    runs-on: xcode-27
    timeout-minutes: 80
    strategy:
      # Every shard runs to its end, so one run shows each shard's result, and
      # "Re-run failed jobs" runs only the shard that failed.
      fail-fast: false
      matrix:
        # The shards in scripts/gate/parts.mjs. A gate test holds the two lists
        # to one.
        shard: [journeys-1, journeys-2, journeys-3, journeys-4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha || github.sha }}
      - name: Select Xcode
        run: |
          sudo xcode-select --switch "/Applications/Xcode_${XCODE_VERSION}.app"
          xcodebuild -version
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install_args: node just
          minimum_release_age: 3d
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gate-build
          path: build
      - name: Unpack the build
        run: tar -xf build/gate-build.tar && rm build/gate-build.tar
      # The shard that builds the package resolves its packages from this
      # cache, as the build job does.
      - name: Cache SwiftPM's cache
        if: hashFiles('**/Package.resolved') != ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: swiftpm-${{ runner.os }}-${{ runner.arch }}-
      # The simulator's first boot on a new runner takes minutes, and uses the
      # whole runner. It starts only when every download is done:
      # - In run 45885449080, two shards that booted before mise's install
      #   failed it, with "sigstore refused the bundle: error refreshing TUF
      #   metadata", while the jobs with no boot beside it passed it.
      # - Beside the boot, the 115 MB gate-build download took 165 s to 479 s
      #   in each shard that booted, in 12 Gate runs on 2026-11-26 and -27,
      #   and 3 s to 11 s in the shard that boots nothing. In run 46007974356,
      #   journeys-1 was cancelled in the download after 6m21s. A cache restore
      #   beside it took 328 s once (run 45972613217).
      # It goes on while the gate starts. The shard that builds the package
      # first boots nothing here: the build beside a first boot was too slow
      # (scripts/gate/boot.mjs).
      - name: Start the simulator's boot
        env:
          SHARD: ${{ matrix.shard }}
        run: node scripts/gate/boot.mjs "$SHARD"
      - name: Gate, the shard ${{ matrix.shard }}
        env:
          SHARD: ${{ matrix.shard }}
        run: node scripts/gate/main.mjs "--part=$SHARD"
      # The part's record, for the Gate result job, which adds the parts up.
      - if: always() && hashFiles('build/gate/part-*.json') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gate-part-${{ matrix.shard }}
          path: build/gate/part-*.json
          retention-days: 7
      # The gate's logs and results, and the build's log. The gate keeps them
      # inside the checkout. They are uploaded when the part fails, and when
      # the part ran a run of the journeys again for a named flake and passed:
      # then the first try's result bundle and log, with `-first` at the end of
      # their names (keepFirstTry in scripts/gate/simulator.mjs), are kept too.
      - if: failure() || hashFiles('build/gate/**/*-first.log', 'build/gate/**/*-first.xcresult/**') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gate-results-${{ matrix.shard }}
          path: |
            build/gate/
            build/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7

  gate-result:
    name: Gate result
    needs: [gate-build, gate-journeys]
    # It runs when a part failed too, so that its line says which.
    if: always() && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    env:
      MISE_ENABLE_TOOLS: node
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha || github.sha }}
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install_args: node
          minimum_release_age: 3d
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: gate-part-*
          path: build/gate/parts
      - name: Add the parts up
        run: node scripts/gate/parts.mjs build/gate/parts

  ci-ok:
    name: CI OK
    needs: [changes, lint, gate-build, gate-journeys, gate-result]
    if: always() && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Check job results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
          EVENT: ${{ github.event_name }}
          GATE_RESULT: ${{ needs.gate-result.result }}
        run: |
          echo "Results: $RESULTS"
          # On a manual run, the gate is the run's point, so its result must
          # be there: a Gate result that was skipped is a failure.
          if [ "$EVENT" = workflow_dispatch ] && [ "$GATE_RESULT" != success ]; then
            echo "::error::The Gate result ended with '$GATE_RESULT'."
            exit 1
          fi
          for r in $RESULTS; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::A required job ended with '$r'."; exit 1 ;;
            esac
          done
